# PoC copy of CiscoDevNet/terraform-provider-nd/.github/workflows/jira-issue-sync.yml
# (sha256 5fdc3d55d4bcb8a5fc615d6074755bdef3fa673f72ac4c38373e50e932397fd4).
# ONLY the action step is replaced: it checks out this repository and runs the
# real sync-jira-actions source (pinned commit d5a339e4cfc4bd0cf2c549973f0eb5420f5810d3)
# with a stubbed `jira` client that prints the Jira calls instead of performing them.
name: Sync GitHub Issues & Pull Requests to Jira

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - ready_for_review
      - review_requested
  workflow_run:
    workflows: [jira-issue-sync-pr-review]
    types:
      - completed
  issues:
  issue_comment:

concurrency:
  group: jira-sync-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  sync_issues_to_jira:
    if: |
      contains(github.event.issue.labels.*.name, 'jira-sync') ||
      contains(github.event.pull_request.labels.*.name, 'jira-sync') ||
      github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install --quiet "PyGithub==2.2.0" "requests==2.31.0"
      - name: Show that a repository secret is available in this context
        env:
          POC_SECRET: ${{ secrets.POC_SECRET }}
        run: echo "POC_SECRET is available: length=${#POC_SECRET}"
      - name: Run vendored sync-jira-actions (Jira client stubbed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_PASS: ${{ secrets.JIRA_PASS }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_PROJECT: DCNE
          JIRA_COMPONENT: terraform-provider-nd
          JIRA_ISSUE_TYPE: GitHub Issue
          INPUT_SYNC_LABEL: jira-sync
          INPUT_STATUS_FIELD_ID: "10740"
          INPUT_FIND_JIRA_RETRIES: "0"
          INPUT_LINK_CLOSING_ISSUES: "true"
          POC_STUB_ISSUE_STATUS: "Reviewer Approved"
          POC_STUB_ISSUE_TYPE: "Bug"
        run: |
          cd poc/action
          python3 sync_to_jira.py

